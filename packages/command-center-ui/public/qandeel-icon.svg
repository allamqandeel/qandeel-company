  </radialGradient>
  <filter id="stroke-bloom" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
   <feGaussianBlur stdDeviation="11.07" result="b"/>
   <feComponentTransfer in="b" result="s"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
   <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
 </defs>

 <!-- background: full bleed, conceptually square. No rounded-square shape is
      baked in; platform masks are applied by the platform, not by this file. -->
 <rect id="icon-ground" x="0" y="0" width="1024" height="1024" fill="#0A0B0D"/>

 <!-- the approved mark, one uniform placement matrix, geometry untouched -->
 <g id="q-placement" transform="matrix(0.312622 0 0 0.312622 244.616708 340.621763)">
  <g id="q-ink" fill="#F4ECDB" filter="url(#stroke-bloom)"><use href="#q-mark"/></g>
  <g id="q-light-core-tint" fill="#F8EFCC"><use href="#q-light-core"/></g>
 </g>

 <!-- adaptive halo/bloom, separate from the structural core it surrounds -->
 <g id="q-halo" transform="matrix(0.312622 0 0 0.312622 244.616708 340.621763)" style="mix-blend-mode:screen" opacity="1.00">
  <circle cx="663.82" cy="905.8" r="324.57" fill="url(#halo-q)"/>
 </g>
</svg>
