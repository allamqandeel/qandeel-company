name: CI

# D-R1-07 / D-C4-08. One run per change, one stable required status (`quality-gate`):
#   docs-only change   → fast, fail-closed docs path (install, build, repository verifier) — no Windows suite;
#   any other change   → the FULL proof set on Windows AND Ubuntu, split into parallel jobs (static / tests /
#                        sharded mutation checks / acceptance) with proof parity enforced by the gate;
#   push to main       → fast integrity proof when the merged tree is exactly the tree a green PR run proved,
#                        otherwise (or on any doubt) the FULL proof set;
#   workflow_dispatch  → the FULL proof set on demand (the manual full-main escape hatch).
# Parallelism never deletes coverage: every test, mutation, verifier rule and acceptance step still runs on both
# operating systems.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads the repository. No secrets are used.
permissions:
  contents: read

# Every step runs under bash (Git Bash on Windows) with -e: a failing command inside a multi-line step fails the
# step on both operating systems (PowerShell would continue past a failing native command).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.pr.outputs.mode || steps.push.outputs.mode || steps.manual.outputs.mode }}
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classifier self-test (fails closed)
        run: node scripts/ci/classify-changes.mjs --self-test
      - name: Pull request — docs-only or full
        id: pr
        if: github.event_name == 'pull_request'
        run: node scripts/ci/classify-changes.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
      - name: Push to main — docs-only, fast integrity or full
        id: push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docs="$(GITHUB_OUTPUT= node scripts/ci/classify-changes.mjs --base "${{ github.event.before }}" --head "${{ github.sha }}")"
          echo "$docs"
          if [ "${docs#mode=docs}" != "$docs" ]; then echo "mode=docs" >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/ci/post-merge-mode.mjs --repo "${{ github.repository }}" --sha "${{ github.sha }}"
      - name: Manual run — always full
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/ci/classify-changes.mjs --force-full

  docs-fast:
    name: docs-fast
    needs: classify
    if: needs.classify.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Build and repository verifier (authority integrity, lifecycle states, boundaries)
        run: |
          npm run build
          npm run verify

  integrity:
    name: integrity (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.mode == 'fast-integrity'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Post-merge integrity — the merged tree is the proven tree (build, typecheck, verifier, C1 acceptance)
        run: |
          npm run build
          npm run typecheck
          npm run verify
          npm run c1:acceptance -- --workspace "${{ runner.temp }}/c1-acceptance"

  static:
    name: static (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Toolchain versions
        run: |
          node --version
          npm --version
          node -e "const {DatabaseSync}=require('node:sqlite');const d=new DatabaseSync(':memory:');console.log('sqlite', d.prepare('select sqlite_version() v').get().v)"
      - run: npm ci
      - name: Build, typecheck, lint, repository verifier
        run: |
          npm run build
          npm run typecheck
          npm run lint
          npm run verify

  tests:
    name: tests (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Every workspace test (unit, real SQLite, multi-process, fault-injection; C1 + C2 + C3 + R1 + C4 + C5 + C6 + C7-A + C7-B + C7-C + C7-D, including the Founder surface, the UI model, the improvement engine, the governed external-evidence intake, the governed control plane, the Pilot instrumentation, the Digital Workshop, the isolated Preview host and the governed promotion adapters)
        run: |
          npm run build
          npm run test

  mutation:
    name: mutation (${{ matrix.os }}, ${{ matrix.label }})
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Disjoint shards; the quality gate proves each OS ran every recorded mutation exactly once.
          # Budget: a Windows shard targets <= 30m; repeated > 35m is a capacity defect — split it, never raise the 45m ceiling.
          - { os: windows-latest, label: c1-c2, suite: 'c1:1/1 c2:1/1' }
          - { os: windows-latest, label: c3-1of2, suite: 'c3:1/2' }
          - { os: windows-latest, label: c3-2of2, suite: 'c3:2/2' }
          - { os: windows-latest, label: r1-1of4, suite: 'r1:1/4' }
          - { os: windows-latest, label: r1-2of4, suite: 'r1:2/4' }
          - { os: windows-latest, label: r1-3of4, suite: 'r1:3/4' }
          - { os: windows-latest, label: r1-4of4, suite: 'r1:4/4' }
          - { os: windows-latest, label: c4-1of2, suite: 'c4:1/2' }
          - { os: windows-latest, label: c4-2of2, suite: 'c4:2/2' }
          - { os: windows-latest, label: c5-1of1, suite: 'c5:1/1' }
          - { os: windows-latest, label: c6-1of4, suite: 'c6:1/4' }
          - { os: windows-latest, label: c6-2of4, suite: 'c6:2/4' }
          - { os: windows-latest, label: c6-3of4, suite: 'c6:3/4' }
          - { os: windows-latest, label: c6-4of4, suite: 'c6:4/4' }
          - { os: windows-latest, label: c7a-1of4, suite: 'c7a:1/4' }
          - { os: windows-latest, label: c7a-2of4, suite: 'c7a:2/4' }
          - { os: windows-latest, label: c7a-3of4, suite: 'c7a:3/4' }
          - { os: windows-latest, label: c7a-4of4, suite: 'c7a:4/4' }
          - { os: windows-latest, label: c7b-1of3, suite: 'c7b:1/3' }
          - { os: windows-latest, label: c7b-2of3, suite: 'c7b:2/3' }
          - { os: windows-latest, label: c7b-3of3, suite: 'c7b:3/3' }
          - { os: windows-latest, label: c7c-1of2, suite: 'c7c:1/2' }
          - { os: windows-latest, label: c7c-2of2, suite: 'c7c:2/2' }
          - { os: windows-latest, label: c7d-1of2, suite: 'c7d:1/2' }
          - { os: windows-latest, label: c7d-2of2, suite: 'c7d:2/2' }
          - { os: ubuntu-latest, label: c1-c2, suite: 'c1:1/1 c2:1/1' }
          - { os: ubuntu-latest, label: c3-1of1, suite: 'c3:1/1' }
          - { os: ubuntu-latest, label: r1-1of2, suite: 'r1:1/2' }
          - { os: ubuntu-latest, label: r1-2of2, suite: 'r1:2/2' }
          - { os: ubuntu-latest, label: c4-c5, suite: 'c4:1/1 c5:1/1' }
          - { os: ubuntu-latest, label: c6-1of1, suite: 'c6:1/1' }
          - { os: ubuntu-latest, label: c7a-1of2, suite: 'c7a:1/2' }
          - { os: ubuntu-latest, label: c7a-2of2, suite: 'c7a:2/2' }
          - { os: ubuntu-latest, label: c7b-1of2, suite: 'c7b:1/2' }
          - { os: ubuntu-latest, label: c7b-2of2, suite: 'c7b:2/2' }
          - { os: ubuntu-latest, label: c7c-1of1, suite: 'c7c:1/1' }
          - { os: ubuntu-latest, label: c7d-1of1, suite: 'c7d:1/1' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Mutation checks (${{ matrix.suite }})
        run: |
          mkdir -p mutation-reports
          for spec in ${{ matrix.suite }}; do
            s="${spec%%:*}"; shard="${spec#*:}"
            node "scripts/${s}-mutation-check.mjs" --shard "$shard" --report "mutation-reports/${{ matrix.os }}__${s}__${shard/\//of}.json"
          done
      - name: Upload the shard's proof report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.os }}-${{ matrix.label }}
          path: mutation-reports/
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: acceptance (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: C1 local acceptance (disposable workspace outside the checkout)
        run: npm run c1:acceptance -- --workspace "${{ runner.temp }}/c1-acceptance"
      - name: C2 local acceptance (disposable workspace; deterministic fake provider, no network, no credentials)
        run: npm run c2:acceptance -- --workspace "${{ runner.temp }}/c2-acceptance"
      - name: C3 local acceptance (disposable workspace; Academy path, governed context, fail-closed activation; fake provider)
        run: npm run c3:acceptance -- --workspace "${{ runner.temp }}/c3-acceptance"
      - name: C4 local acceptance (disposable workspace; organization, delegation, Review Pool, P-07; fake provider)
        run: npm run c4:acceptance -- --workspace "${{ runner.temp }}/c4-acceptance"
      - name: C5 local acceptance (disposable workspace; Founder auth fail-closed, Goals, communication, attention, governed confirmation, projection, restart; fake provider)
        run: npm run c5:acceptance -- --workspace "${{ runner.temp }}/c5-acceptance"
      - name: C6 local acceptance (disposable workspace; evaluation, attribution, learning, reports, encrypted portable backup, clean-device restore, update hold; fake provider, no network, no credentials)
        run: npm run c6:acceptance -- --workspace "${{ runner.temp }}/c6-acceptance"
      - name: C5 browser smoke (the real UI in headless Chrome through CDP; the company surface renders, selection, focus, reduced motion, no external asset)
        timeout-minutes: 8
        run: npm run c5:spike -- --workspace "${{ runner.temp }}/c5-spike"

  quality-gate:
    name: quality-gate
    needs: [classify, docs-fast, integrity, static, tests, mutation, acceptance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the mutation proof reports
        if: needs.classify.outputs.mode == 'full'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-*
          path: mutation-reports
          merge-multiple: true
      - name: Gate — every required job green, mutation proof parity on both operating systems
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > needs.json
          node scripts/ci/quality-gate.mjs --mode "${{ needs.classify.outputs.mode }}" --needs needs.json --reports mutation-reports
      - name: Record the proven tree (lets the post-merge run take the fast integrity path)
        if: github.event_name == 'pull_request' && needs.classify.outputs.mode == 'full'
        run: git rev-parse 'HEAD^{tree}' > tested-tree.txt
      - name: Upload the proven tree
        if: github.event_name == 'pull_request' && needs.classify.outputs.mode == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-tree
          path: tested-tree.txt
          if-no-files-found: error
          retention-days: 30
