name: CI

# D-R1-07 / D-C4-08 / D-D0-01. One run per change, one stable required status (`quality-gate`). The mode comes
# from the ONE canonical impact map (scripts/ci/impact-map.mjs — the same map `npm run validate:affected` uses):
#   docs           → fast, fail-closed docs path (install, build, repository verifier) — no Windows suite;
#   affected       → only safely owned boundaries changed: that boundary's declared proof (static, its workspace
#                    tests, its acceptance, its mutation families with parity) on the planned OSes — Windows
#                    always; the machine-readable plan is an artifact the gate re-derives and checks;
#   full           → anything else (high-risk, unknown, ambiguous, mixed, empty, any error): the FULL proof set on
#                    Windows AND Ubuntu, split into parallel jobs (static / tests / sharded mutation checks /
#                    acceptance, and the Windows Desktop proof `desktop` — D1) with proof parity enforced by the gate;
#   fast-integrity → push to main whose merged tree is exactly the tree a green PR run (full OR affected) proved,
#                    otherwise (or on any doubt) the FULL proof set;
#   workflow_dispatch → the FULL proof set on demand (the manual full-main / release-candidate gate).
# Parallelism never deletes coverage: every test, mutation, verifier rule and acceptance step still runs on both
# operating systems in FULL. A Desktop release candidate needs one green FULL gate on its exact tree (D-D0-01).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads the repository. No secrets are used.
permissions:
  contents: read

# Every step runs under bash (Git Bash on Windows) with -e: a failing command inside a multi-line step fails the
# step on both operating systems (PowerShell would continue past a failing native command).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.pr.outputs.mode || steps.push.outputs.mode || steps.manual.outputs.mode }}
      affected_os: ${{ steps.pr.outputs.affected_os || '[]' }}
      mutation_matrix: ${{ steps.pr.outputs.mutation_matrix || '[]' }}
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validation architecture self-tests (impact map + repository audit, classifier, gate, post-merge; fail closed)
        run: |
          node scripts/ci/impact-map.mjs --self-test
          node scripts/ci/classify-changes.mjs --self-test
          node scripts/ci/quality-gate.mjs --self-test
          node scripts/ci/post-merge-mode.mjs --self-test
      - name: Pull request — docs, affected or full (canonical impact map)
        id: pr
        if: github.event_name == 'pull_request'
        run: node scripts/ci/classify-changes.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --plan-out validation-plan.json
      - name: Upload the validation plan (machine-readable, names its mode)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-plan
          path: validation-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Push to main — docs-only, fast integrity or full
        id: push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docs="$(GITHUB_OUTPUT= node scripts/ci/classify-changes.mjs --base "${{ github.event.before }}" --head "${{ github.sha }}")"
          echo "$docs"
          if [ "${docs#mode=docs}" != "$docs" ]; then echo "mode=docs" >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/ci/post-merge-mode.mjs --repo "${{ github.repository }}" --sha "${{ github.sha }}"
      - name: Manual run — always full
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/ci/classify-changes.mjs --force-full

  docs-fast:
    name: docs-fast
    needs: classify
    if: needs.classify.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Build and repository verifier (authority integrity, lifecycle states, boundaries)
        run: |
          npm run build
          npm run verify

  integrity:
    name: integrity (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.mode == 'fast-integrity'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Post-merge integrity — the merged tree is the proven tree (build, typecheck, verifier, C1 acceptance)
        run: |
          npm run build
          npm run typecheck
          npm run verify
          npm run c1:acceptance -- --workspace "${{ runner.temp }}/c1-acceptance"

  affected-checks:
    name: affected (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.mode == 'affected'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.classify.outputs.affected_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Download the validation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-plan
          path: validation-plan
      - name: Affected boundary proof (steps re-derived from the canonical impact map; build, typecheck, lint, verifier, boundary tests, acceptance)
        run: node scripts/ci/validate-affected.mjs --execute-plan validation-plan/validation-plan.json --os "${{ matrix.os }}" --proof-out "affected-proof/${{ matrix.os }}.json"
      - name: Upload the affected proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: affected-proof-${{ matrix.os }}
          path: affected-proof/
          if-no-files-found: error
          retention-days: 14

  affected-mutation:
    name: affected mutation (${{ matrix.os }}, ${{ matrix.label }})
    needs: classify
    if: needs.classify.outputs.mode == 'affected' && needs.classify.outputs.mutation_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        # The plan's families only, with the same shards as the FULL matrix (the impact map audits the equality).
        include: ${{ fromJSON(needs.classify.outputs.mutation_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Mutation checks (${{ matrix.suite }})
        run: |
          mkdir -p mutation-reports
          for spec in ${{ matrix.suite }}; do
            s="${spec%%:*}"; shard="${spec#*:}"
            node "scripts/${s}-mutation-check.mjs" --shard "$shard" --report "mutation-reports/${{ matrix.os }}__${s}__${shard/\//of}.json"
          done
      - name: Upload the shard's proof report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.os }}-${{ matrix.label }}
          path: mutation-reports/
          if-no-files-found: error
          retention-days: 14

  static:
    name: static (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Toolchain versions
        run: |
          node --version
          npm --version
          node -e "const {DatabaseSync}=require('node:sqlite');const d=new DatabaseSync(':memory:');console.log('sqlite', d.prepare('select sqlite_version() v').get().v)"
      - run: npm ci
      - name: Build, typecheck, lint, repository verifier
        run: |
          npm run build
          npm run typecheck
          npm run lint
          npm run verify

  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.label }})
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Disjoint shards of every workspace test suite plus the harness (D-P1-17). scripts/ci/impact-map.mjs
          # (TEST_SHARDS) audits this list in classify, before any long job; the quality gate proves every tracked test
          # file of every workspace, and the harness, ran exactly once on EACH operating system (test parity).
          # Budget: a Windows job targets <= 25m; repeated > 30m is a capacity defect — split it, never raise the 45m ceiling.
          - { os: windows-latest, label: storage-1of6, suite: 'storage:1/6' }
          - { os: windows-latest, label: storage-2of6, suite: 'storage:2/6' }
          - { os: windows-latest, label: storage-3of6, suite: 'storage:3/6' }
          - { os: windows-latest, label: storage-4of6, suite: 'storage:4/6' }
          - { os: windows-latest, label: storage-5of6, suite: 'storage:5/6' }
          - { os: windows-latest, label: storage-6of6, suite: 'storage:6/6' }
          - { os: windows-latest, label: runtime-1of3, suite: 'runtime:1/3' }
          - { os: windows-latest, label: runtime-2of3, suite: 'runtime:2/3' }
          - { os: windows-latest, label: runtime-3of3, suite: 'runtime:3/3' }
          - { os: windows-latest, label: other-workspaces-harness, suite: 'command-center:1/1 bootstrap-contract:1/1 domain:1/1 governance:1/1 mind:1/1 secret-vault:1/1 model-providers:1/1 tool-drivers:1/1 command-center-ui:1/1 harness:1/1' }
          - { os: ubuntu-latest, label: storage-1of6, suite: 'storage:1/6' }
          - { os: ubuntu-latest, label: storage-2of6, suite: 'storage:2/6' }
          - { os: ubuntu-latest, label: storage-3of6, suite: 'storage:3/6' }
          - { os: ubuntu-latest, label: storage-4of6, suite: 'storage:4/6' }
          - { os: ubuntu-latest, label: storage-5of6, suite: 'storage:5/6' }
          - { os: ubuntu-latest, label: storage-6of6, suite: 'storage:6/6' }
          - { os: ubuntu-latest, label: runtime-1of3, suite: 'runtime:1/3' }
          - { os: ubuntu-latest, label: runtime-2of3, suite: 'runtime:2/3' }
          - { os: ubuntu-latest, label: runtime-3of3, suite: 'runtime:3/3' }
          - { os: ubuntu-latest, label: other-workspaces-harness, suite: 'command-center:1/1 bootstrap-contract:1/1 domain:1/1 governance:1/1 mind:1/1 secret-vault:1/1 model-providers:1/1 tool-drivers:1/1 command-center-ui:1/1 harness:1/1' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Workspace tests (${{ matrix.suite }}; unit, real SQLite, multi-process, fault-injection; C1 + C2 + C3 + R1 + C4 + C5 + C6 + C7-A + C7-B + C7-C + C7-D + L1-01, including the Founder surface, the UI model, the improvement engine, the governed external-evidence intake, the governed control plane, the Pilot instrumentation, the Digital Workshop, the isolated Preview host, the governed promotion adapters, the Windows secret vault and the DeepSeek provider adapter behind a fake transport)
        run: |
          npm run build
          mkdir -p test-reports
          for spec in ${{ matrix.suite }}; do
            u="${spec%%:*}"; shard="${spec#*:}"; report="test-reports/${{ matrix.os }}__${u}__${shard/\//of}.json"
            if [ "$u" = harness ]; then
              npm run test:harness
              node scripts/ci/impact-map.mjs --harness-report "$report"
            else
              (cd "packages/$u" && node ../../scripts/run-node-tests.mjs --shard "$shard" --report "../../$report")
            fi
          done
      - name: Upload the shard's test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-${{ matrix.label }}
          path: test-reports/
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: mutation (${{ matrix.os }}, ${{ matrix.label }})
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Disjoint shards; the quality gate proves each OS ran every recorded mutation exactly once.
          # Budget: a Windows shard targets <= 25m (sized from measured per-mutation durations, D-P1-17); repeated > 30m is a
          # capacity defect — split it, never raise the 45m ceiling.
          - { os: windows-latest, label: c1-c2-1of2, suite: 'c1:1/1 c2:1/2' }
          - { os: windows-latest, label: c2-2of2, suite: 'c2:2/2' }
          - { os: windows-latest, label: c3-1of3, suite: 'c3:1/3' }
          - { os: windows-latest, label: c3-2of3, suite: 'c3:2/3' }
          - { os: windows-latest, label: c3-3of3, suite: 'c3:3/3' }
          - { os: windows-latest, label: r1-1of13, suite: 'r1:1/13' }
          - { os: windows-latest, label: r1-2of13, suite: 'r1:2/13' }
          - { os: windows-latest, label: r1-3of13, suite: 'r1:3/13' }
          - { os: windows-latest, label: r1-4of13, suite: 'r1:4/13' }
          - { os: windows-latest, label: r1-5of13, suite: 'r1:5/13' }
          - { os: windows-latest, label: r1-6of13, suite: 'r1:6/13' }
          - { os: windows-latest, label: r1-7of13, suite: 'r1:7/13' }
          - { os: windows-latest, label: r1-8of13, suite: 'r1:8/13' }
          - { os: windows-latest, label: r1-9of13, suite: 'r1:9/13' }
          - { os: windows-latest, label: r1-10of13, suite: 'r1:10/13' }
          - { os: windows-latest, label: r1-11of13, suite: 'r1:11/13' }
          - { os: windows-latest, label: r1-12of13, suite: 'r1:12/13' }
          - { os: windows-latest, label: r1-13of13, suite: 'r1:13/13' }
          - { os: windows-latest, label: c4-1of2, suite: 'c4:1/2' }
          - { os: windows-latest, label: c4-2of2, suite: 'c4:2/2' }
          - { os: windows-latest, label: c5-1of1, suite: 'c5:1/1' }
          - { os: windows-latest, label: c6-1of6, suite: 'c6:1/6' }
          - { os: windows-latest, label: c6-2of6, suite: 'c6:2/6' }
          - { os: windows-latest, label: c6-3of6, suite: 'c6:3/6' }
          - { os: windows-latest, label: c6-4of6, suite: 'c6:4/6' }
          - { os: windows-latest, label: c6-5of6, suite: 'c6:5/6' }
          - { os: windows-latest, label: c6-6of6, suite: 'c6:6/6' }
          - { os: windows-latest, label: c7a-1of9, suite: 'c7a:1/9' }
          - { os: windows-latest, label: c7a-2of9, suite: 'c7a:2/9' }
          - { os: windows-latest, label: c7a-3of9, suite: 'c7a:3/9' }
          - { os: windows-latest, label: c7a-4of9, suite: 'c7a:4/9' }
          - { os: windows-latest, label: c7a-5of9, suite: 'c7a:5/9' }
          - { os: windows-latest, label: c7a-6of9, suite: 'c7a:6/9' }
          - { os: windows-latest, label: c7a-7of9, suite: 'c7a:7/9' }
          - { os: windows-latest, label: c7a-8of9, suite: 'c7a:8/9' }
          - { os: windows-latest, label: c7a-9of9, suite: 'c7a:9/9' }
          - { os: windows-latest, label: c7b-1of4, suite: 'c7b:1/4' }
          - { os: windows-latest, label: c7b-2of4, suite: 'c7b:2/4' }
          - { os: windows-latest, label: c7b-3of4, suite: 'c7b:3/4' }
          - { os: windows-latest, label: c7b-4of4, suite: 'c7b:4/4' }
          - { os: windows-latest, label: c7c-1of2, suite: 'c7c:1/2' }
          - { os: windows-latest, label: c7c-2of2, suite: 'c7c:2/2' }
          - { os: windows-latest, label: c7d-1of2, suite: 'c7d:1/2' }
          - { os: windows-latest, label: c7d-2of2, suite: 'c7d:2/2' }
          - { os: windows-latest, label: l1-1of27, suite: 'l1:1/27' }
          - { os: windows-latest, label: l1-2of27, suite: 'l1:2/27' }
          - { os: windows-latest, label: l1-3of27, suite: 'l1:3/27' }
          - { os: windows-latest, label: l1-4of27, suite: 'l1:4/27' }
          - { os: windows-latest, label: l1-5of27, suite: 'l1:5/27' }
          - { os: windows-latest, label: l1-6of27, suite: 'l1:6/27' }
          - { os: windows-latest, label: l1-7of27, suite: 'l1:7/27' }
          - { os: windows-latest, label: l1-8of27, suite: 'l1:8/27' }
          - { os: windows-latest, label: l1-9of27, suite: 'l1:9/27' }
          - { os: windows-latest, label: l1-10of27, suite: 'l1:10/27' }
          - { os: windows-latest, label: l1-11of27, suite: 'l1:11/27' }
          - { os: windows-latest, label: l1-12of27, suite: 'l1:12/27' }
          - { os: windows-latest, label: l1-13of27, suite: 'l1:13/27' }
          - { os: windows-latest, label: l1-14of27, suite: 'l1:14/27' }
          - { os: windows-latest, label: l1-15of27, suite: 'l1:15/27' }
          - { os: windows-latest, label: l1-16of27, suite: 'l1:16/27' }
          - { os: windows-latest, label: l1-17of27, suite: 'l1:17/27' }
          - { os: windows-latest, label: l1-18of27, suite: 'l1:18/27' }
          - { os: windows-latest, label: l1-19of27, suite: 'l1:19/27' }
          - { os: windows-latest, label: l1-20of27, suite: 'l1:20/27' }
          - { os: windows-latest, label: l1-21of27, suite: 'l1:21/27' }
          - { os: windows-latest, label: l1-22of27, suite: 'l1:22/27' }
          - { os: windows-latest, label: l1-23of27, suite: 'l1:23/27' }
          - { os: windows-latest, label: l1-24of27, suite: 'l1:24/27' }
          - { os: windows-latest, label: l1-25of27, suite: 'l1:25/27' }
          - { os: windows-latest, label: l1-26of27, suite: 'l1:26/27' }
          - { os: windows-latest, label: l1-27of27, suite: 'l1:27/27' }
          - { os: ubuntu-latest, label: c1-c2, suite: 'c1:1/1 c2:1/1' }
          - { os: ubuntu-latest, label: c3-1of1, suite: 'c3:1/1' }
          - { os: ubuntu-latest, label: r1-1of2, suite: 'r1:1/2' }
          - { os: ubuntu-latest, label: r1-2of2, suite: 'r1:2/2' }
          - { os: ubuntu-latest, label: c4-c5, suite: 'c4:1/1 c5:1/1' }
          - { os: ubuntu-latest, label: c6-1of1, suite: 'c6:1/1' }
          - { os: ubuntu-latest, label: c7a-1of2, suite: 'c7a:1/2' }
          - { os: ubuntu-latest, label: c7a-2of2, suite: 'c7a:2/2' }
          - { os: ubuntu-latest, label: c7b-1of2, suite: 'c7b:1/2' }
          - { os: ubuntu-latest, label: c7b-2of2, suite: 'c7b:2/2' }
          - { os: ubuntu-latest, label: c7c-1of1, suite: 'c7c:1/1' }
          - { os: ubuntu-latest, label: c7d-1of1, suite: 'c7d:1/1' }
          - { os: ubuntu-latest, label: l1-1of12, suite: 'l1:1/12' }
          - { os: ubuntu-latest, label: l1-2of12, suite: 'l1:2/12' }
          - { os: ubuntu-latest, label: l1-3of12, suite: 'l1:3/12' }
          - { os: ubuntu-latest, label: l1-4of12, suite: 'l1:4/12' }
          - { os: ubuntu-latest, label: l1-5of12, suite: 'l1:5/12' }
          - { os: ubuntu-latest, label: l1-6of12, suite: 'l1:6/12' }
          - { os: ubuntu-latest, label: l1-7of12, suite: 'l1:7/12' }
          - { os: ubuntu-latest, label: l1-8of12, suite: 'l1:8/12' }
          - { os: ubuntu-latest, label: l1-9of12, suite: 'l1:9/12' }
          - { os: ubuntu-latest, label: l1-10of12, suite: 'l1:10/12' }
          - { os: ubuntu-latest, label: l1-11of12, suite: 'l1:11/12' }
          - { os: ubuntu-latest, label: l1-12of12, suite: 'l1:12/12' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Mutation checks (${{ matrix.suite }})
        run: |
          mkdir -p mutation-reports
          for spec in ${{ matrix.suite }}; do
            s="${spec%%:*}"; shard="${spec#*:}"
            node "scripts/${s}-mutation-check.mjs" --shard "$shard" --report "mutation-reports/${{ matrix.os }}__${s}__${shard/\//of}.json"
          done
      - name: Upload the shard's proof report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.os }}-${{ matrix.label }}
          path: mutation-reports/
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: acceptance (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: C1 local acceptance (disposable workspace outside the checkout)
        run: npm run c1:acceptance -- --workspace "${{ runner.temp }}/c1-acceptance"
      - name: C2 local acceptance (disposable workspace; deterministic fake provider, no network, no credentials)
        run: npm run c2:acceptance -- --workspace "${{ runner.temp }}/c2-acceptance"
      - name: C3 local acceptance (disposable workspace; Academy path, governed context, fail-closed activation; fake provider)
        run: npm run c3:acceptance -- --workspace "${{ runner.temp }}/c3-acceptance"
      - name: C4 local acceptance (disposable workspace; organization, delegation, Review Pool, P-07; fake provider)
        run: npm run c4:acceptance -- --workspace "${{ runner.temp }}/c4-acceptance"
      - name: C5 local acceptance (disposable workspace; Founder auth fail-closed, Goals, communication, attention, governed confirmation, projection, restart; fake provider)
        run: npm run c5:acceptance -- --workspace "${{ runner.temp }}/c5-acceptance"
      - name: C6 local acceptance (disposable workspace; evaluation, attribution, learning, reports, encrypted portable backup, clean-device restore, update hold; fake provider, no network, no credentials)
        run: npm run c6:acceptance -- --workspace "${{ runner.temp }}/c6-acceptance"
      - name: C5 browser smoke (the real UI in headless Chrome through CDP; the company surface renders, selection, focus, reduced motion, no external asset)
        timeout-minutes: 8
        run: npm run c5:spike -- --workspace "${{ runner.temp }}/c5-spike"

  # D1 (D-D1-07): the Desktop v1 proof on Windows — desktop:proof, the real Setup.exe end to end (desktop:e2e) and the
  # verified ENGINEERING Setup artifact — built from the exact head of the change.
  desktop:
    name: desktop
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  quality-gate:
    name: quality-gate
    needs: [classify, docs-fast, integrity, affected-checks, affected-mutation, static, tests, mutation, acceptance, desktop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the mutation proof reports
        if: needs.classify.outputs.mode == 'full' || needs.classify.outputs.mode == 'affected'
        continue-on-error: true # a missing report fails the gate's parity check (fail closed)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-*
          path: mutation-reports
          merge-multiple: true
      - name: Download the workspace test reports
        if: needs.classify.outputs.mode == 'full'
        continue-on-error: true # a missing report fails the gate's test parity check (fail closed)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tests-*
          path: test-reports
          merge-multiple: true
      - name: Download the validation plan
        if: needs.classify.outputs.mode == 'affected'
        continue-on-error: true # a missing plan fails the gate (fail closed)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-plan
          path: validation-plan
      - name: Download the affected proofs
        if: needs.classify.outputs.mode == 'affected'
        continue-on-error: true # a missing proof fails the gate (fail closed)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: affected-proof-*
          path: affected-proofs
          merge-multiple: true
      - name: Gate — every required job green, the mode's proof complete (FULL mutation and test parity on both OSes; affected plan re-derived and proven)
        env:
          NEEDS: ${{ toJSON(needs) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$NEEDS" > needs.json
          node scripts/ci/quality-gate.mjs --mode "${{ needs.classify.outputs.mode }}" --needs needs.json --reports mutation-reports --test-reports test-reports --plan validation-plan/validation-plan.json --proofs affected-proofs --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Record the proven tree and its proof mode (lets the post-merge run take the fast integrity path)
        if: github.event_name == 'pull_request' && (needs.classify.outputs.mode == 'full' || needs.classify.outputs.mode == 'affected')
        run: node scripts/ci/post-merge-mode.mjs --record-tested-tree tested-tree.json --mode "${{ needs.classify.outputs.mode }}"
      - name: Upload the proven tree
        if: github.event_name == 'pull_request' && (needs.classify.outputs.mode == 'full' || needs.classify.outputs.mode == 'affected')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-tree
          path: tested-tree.json
          if-no-files-found: error
          retention-days: 30
