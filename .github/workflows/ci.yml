name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repository. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (${{ matrix.os }})
    # Windows is the Founder's operating platform; Linux is the Claude Cloud build platform.
    # Every C1, C2 and C3 proof (unit, real-SQLite, multi-process, fault-injection, mutation, acceptance) runs on both.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Toolchain versions
        run: |
          node --version
          npm --version
          node -e "const {DatabaseSync}=require('node:sqlite');const d=new DatabaseSync(':memory:');console.log('sqlite', d.prepare('select sqlite_version() v').get().v)"

      - name: Clean install
        run: npm ci

      - name: Full check (build, typecheck, lint, all C1 + C2 + C3 tests incl. multi-process + fault matrices, C1 + C2 + C3 mutation checks, verify)
        run: npm run ci

      - name: C1 local acceptance (disposable workspace outside the checkout)
        run: npm run c1:acceptance -- --workspace "${{ runner.temp }}/c1-acceptance"

      - name: C2 local acceptance (disposable workspace; deterministic fake provider, no network, no credentials)
        run: npm run c2:acceptance -- --workspace "${{ runner.temp }}/c2-acceptance"

      - name: C3 local acceptance (disposable workspace; Academy path, governed context, fail-closed activation; fake provider)
        run: npm run c3:acceptance -- --workspace "${{ runner.temp }}/c3-acceptance"
