<!-- QANDEEL App Icon Presentation Study B - DARK LUMINOUS
     I-08B2.4. NOT approved, NOT frozen, NOT canonical. One of three directions
     for Product visual review; the directions are not ranked.

     The Q geometry is the APPROVED I-08B2.3 compact mark, unmodified. The
     defs group id="q-mark" below is a verbatim copy of the one in
     QANDEEL_Q_BASE_MASTER.svg (ring, tail, structural light-point core).
     It is placed by one uniform matrix and is otherwise untouched.

     Framing (identical in all three directions):
       canvas 1024 x 1024, conceptually square, no mask shape baked in;
       the mark's minimum enclosing circle is set equal to the Android adaptive
       safe circle (66/108 of the canvas), concentric with it, so no ink - ring,
       opening, tail, tail termination or light point - can be masked away.

     COLOUR STATUS: every colour in this file is an APP ICON PRESENTATION
     CANDIDATE. None is a QANDEEL Brand colour token. Brand tokens are not
     frozen by this task. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1024 1024" width="1024" height="1024" fill-rule="nonzero">
 <title>QANDEEL App Icon B - DARK LUMINOUS</title>
 <desc>App-icon presentation candidate. The approved I-08B2.3 compact Q, unmodified, placed by a single uniform matrix. Same ground as A. The approved halo at full measured radius and opacity, plus a restrained stroke bloom so the tail keeps light at small sizes.</desc>
 <defs>
