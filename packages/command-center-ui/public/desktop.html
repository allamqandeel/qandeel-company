<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>QANDEEL — Company</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="launch-body desktop-body">
  <main class="lock-card lifecycle" id="lifecycle" data-phase="CONNECTING" aria-live="polite">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">QANDEEL</span><span class="lens">Company control</span></div>
    <h1 id="lc-title">Connecting…</h1>
    <p id="lc-text">Taking over the controls of this window.</p>
    <div class="lc-progress" id="lc-progress" role="progressbar" aria-label="In progress"><span></span></div>
    <div class="lc-actions">
      <button type="button" class="btn btn-primary" id="lc-start" hidden>Start Company</button>
      <button type="button" class="btn btn-quiet" id="lc-status" hidden>Check status</button>
    </div>
    <p class="lc-code" id="lc-code"></p>
  </main>
  <script type="module" src="/app/app/desktop.js"></script>
</body>
</html>
